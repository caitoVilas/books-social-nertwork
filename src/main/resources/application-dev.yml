## PROFILE DEV

server:
  servlet:
    context-path: /bsn/api
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  port: 3000
spring:
  application:
    name: bsn-api

  datasource:
    url: jdbc:mysql://localhost:3306/bsn
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    hibernate:
      ddl-auto: update
    show-sql: true
    database: mysql

